let lang=JKE_STORAGE.get('jke-toolkit-lang','ko');let query='';
const $=id=>document.getElementById(id);const grid=$('grid');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const t=I[lang]||I.en;const items=meta.map((m,i)=>({...m,title:t.apps[i][0],desc:t.apps[i][1],tags:t.apps[i][2]}));const q=query.trim().toLowerCase();const filtered=items.filter(x=>!q||[x.title,x.desc,...x.tags].join(' ').toLowerCase().includes(q));$('count').textContent=t.count.replace('{n}',filtered.length);grid.innerHTML=filtered.length?filtered.map((x,i)=>`<a class="card" style="--icon-color:${x.c};--icon-bg:${x.c}18;--glow:${x.c}16;animation-delay:${i*.04}s" href="${APP_PREFIX+x.file}"><div class="card-top"><div class="icon">${x.emoji}</div><span class="num">${String(meta.findIndex(m=>m.id===x.id)+1).padStart(2,'0')}</span></div><h2>${esc(x.title)}</h2><p class="desc">${esc(x.desc)}</p><div class="tags">${x.tags.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div><span class="arrow">→</span></a>`).join(''):`<div class="empty">${t.none}</div>`}
function apply(){const t=I[lang]||I.en;document.documentElement.lang=lang;document.title='JKE AI Toolkit · GPT‑5.6';$('lang').value=lang;$('eyebrow').textContent=t.eyebrow;$('title').innerHTML=t.title;$('lead').textContent=t.lead;$('search').placeholder=t.search;$('toolCountLabel').textContent=t.tools;$('privacy').textContent=t.privacy;JKE_STORAGE.set('jke-toolkit-lang',lang);render()}
$('lang').addEventListener('change',e=>{lang=e.target.value;apply()});$('search').addEventListener('input',e=>{query=e.target.value;render()});$('theme').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;JKE_STORAGE.set('jke-toolkit-theme',next)});document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName||'';const editing=['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable;if(e.key==='/'&&!editing){e.preventDefault();$('search').focus()}if(/^[1-8]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!editing)location.href=APP_PREFIX+meta[Number(e.key)-1].file});document.documentElement.dataset.theme=JKE_STORAGE.get('jke-toolkit-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');$('runtimePill').textContent=JKE_RUNTIME.label;apply();
</script>
