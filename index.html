<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176f60" />
    <meta
      name="description"
      content="A thoughtful prompt workspace for the GPT-6 era. Explore, customize, and build prompts in seven languages."
    />
    <title>myprompt · GPT-6</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/app.css" />
    <script defer src="assets/core.js"></script>
    <script defer src="assets/i18n.js"></script>
    <script defer src="assets/prompts.js"></script>
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <dialog id="prompt-dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <noscript
      >JavaScript を有効にしてください。 / 请启用 JavaScript。 / Enable
      JavaScript. / Vui lòng bật JavaScript. / Activez JavaScript. / Activa
      JavaScript. / JavaScript를 켜주세요.</noscript
    >
  </body>
</html>
