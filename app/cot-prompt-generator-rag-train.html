y:flex;flex-direction:column;gap:5px;margin-bottom:9px}.field label{font-size:9px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);padding:9px 10px;font-size:10px;outline:0}.textarea{min-height:68px;resize:vertical;line-height:1.55}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(106,158,255,.09)}.sources{display:flex;gap:6px;flex-wrap:wrap}.src{display:flex;gap:6px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:9px;color:var(--sub);cursor:pointer}.src:has(input:checked){border-color:var(--blue);color:var(--text);background:rgba(106,158,255,.08)}.src input{accent-color:var(--blue)}.btn-row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);padding:8px 11px;font-size:9px;font-weight:600;cursor:pointer}.btn:hover{border-color:var(--blue)}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--violet));border:0;color:white}.divider{height:1px;background:var(--line);margin:15px 0}.output-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.output-head h2{font-size:13px;margin:0}.output-actions{display:flex;gap:6px}.prompt{min-height:calc(100vh - 185px);max-height:calc(100vh - 185px);overflow:auto;white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:1.72;color:var(--sub);box-shadow:var(--shadow)}.stats{display:flex;gap:10px;color:var(--sub);font-size:8px;margin-top:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface3);font-size:9px;box-shadow:var(--shadow);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1020px){.layout{grid-template-columns:1fr}.panel{max-height:none}.left{border-right:0;border-bottom:1px solid var(--line)}.prompt{min-height:520px;max-height:none}}@media(max-width:600px){.panel{padding:14px}.grid2,.grid3{grid-template-columns:1fr}.top{padding:0 10px}.brand strong{font-size:10px}.model-badge{display:none}}

<body><header class="top"><div class="brand"><a href="../index.html" class="home">←</a><span class="dot"></span><strong>ENGINEERING RAG STUDIO</strong></div><div class="actions"><select class="ctrl" id="lang"><option value="ko">KO</option><option value="ja">JA</option><option value="en">EN</option></select><button class="ctrl" id="theme">◐</button></div></header>
<div class="layout"><section class="panel left"><div class="title"><div><h1 data-i="title">GPT‑5.6 RAG 프롬프트 스튜디오</h1><p data-i="subtitle">검색 질의 · HyDE · 출처 · 신뢰도 · 기술 보고서</p></div><span class="model-badge" id="profileBadge">GPT‑5.6 TERRA</span></div>
<div class="section"><div class="section-head"><span class="num">01</span><b data-i="s1">목표와 모델</b></div><div class="grid3"><div class="field"><label data-i="domainL">Domain</label><select class="select" id="domain"><option value="automotive">Automotive</option><option value="quality">Quality / Manufacturing</option><option value="general">General</option></select></div><div class="field"><label data-i="modelL">Model profile</label><select class="select" id="model"><option value="GPT-5.6 Sol">GPT‑5.6 Sol</option><option value="GPT-5.6 Terra" selected>GPT‑5.6 Terra</option><option value="GPT-5.6 Luna">GPT‑5.6 Luna</option><option value="Azure GPT-5.1">Azure GPT‑5.1</option><option value="NVIDIA Llama 4 Maverick">NVIDIA Llama 4 Maverick</option><option value="Custom">Custom</option></select></div><div class="field"><label data-i="modeL">Retrieval mode</label><select class="select" id="mode"><option value="hybrid">Hybrid</option><option value="semantic">Semantic</option><option value="keyword">Keyword</option></select></div></div><div class="grid2"><div class="field"><label data-i="roleL">Role</label><input class="input" id="role" value="자동차 공학 및 품질 분석 전문가"></div><div class="field"><label data-i="goalL">Goal</label><input class="input" id="goal" placeholder="예: Parking pawl 변경점의 리스크 검토 보고서"></div></div><div class="grid2"><div class="field"><label data-i="contextL">Context</label><textarea class="textarea" id="context" placeholder="프로젝트, 문제 현상, 기존 판단, 분석 범위"></textarea></div><div class="field"><label data-i="constraintsL">Constraints</label><textarea class="textarea" id="constraints" placeholder="출력 형식, 보안, 일정, 금지사항"></textarea></div></div></div>
<div class="section"><div class="section-head"><span class="num">02</span><b data-i="s2">검색 조건과 자료</b></div><div class="field"><label data-i="entitiesL">Core entities / keywords</label><input class="input" id="entities" placeholder="pawl, rod plate, detent spring, 33% grade, P lock"></div><div class="grid3"><div class="field"><label data-i="fromL">From</label><input class="input" type="date" id="from"></div><div class="field"><label data-i="toL">To</label><input class="input" type="date" id="to"></div><div class="field"><label data-i="topkL">Top K</label><input class="input" type="number" id="topk" value="12" min="3" max="50"></div></div><div class="field"><label data-i="sourcesL">Sources</label><div class="sources"><label class="src"><input type="checkbox" value="technical documents" checked>Tech docs</label><label class="src"><input type="checkbox" value="test results database" checked>Test DB</label><label class="src"><input type="checkbox" value="PDF reports" checked>PDF</label><label class="src"><input type="checkbox" value="PowerPoint decks">PPT</label><label class="src"><input type="checkbox" value="Excel workbooks">Excel</label><label class="src"><input type="checkbox" value="images and drawings">Images</label><label class="src"><input type="checkbox" value="email archive">Email</label><label class="src"><input type="checkbox" value="standards and regulations">Standards</label></div></div></div>
<div class="section"><div class="section-head"><span class="num">03</span><b data-i="s3">검색 질의와 HyDE</b></div><div class="grid2"><div class="field"><label data-i="queriesL">Search queries</label><textarea class="textarea" id="queries" style="min-height:120px"></textarea><button class="btn" id="genQueries" data-i="genQueries">질의 자동 생성</button></div><div class="field"><label data-i="hydeL">Hypothetical document (HyDE)</label><textarea class="textarea" id="hyde" style="min-height:120px"></textarea><button class="btn" id="genHyde" data-i="genHyde">HyDE 생성</button></div></div></div>
<div class="btn-row"><button class="btn btn-primary" id="build" data-i="build">최종 프롬프트 생성</button><button class="btn" id="sample" data-i="sample">자동차 예시</button><button class="btn" id="clear" data-i="clear">초기화</button></div></section>
<section class="panel"><div class="output-head"><h2 data-i="finalTitle">최종 시스템 프롬프트</h2><div class="output-actions"><button class="btn btn-primary" id="copy" data-i="copy">복사</button><button class="btn" id="json">JSON</button><button class="btn" id="txt">TXT</button></div></div><pre class="prompt" id="out"></pre><div class="stats"><span id="chars">0 chars</span><span id="lines">0 lines</span><span data-i="note">모델은 교체 가능하며 검색·인용 계약은 유지됩니다.</span></div></section></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let lang=localStorage.getItem('rag-lang')||'ko';const T={ko:{title:'GPT‑5.6 RAG 프롬프트 스튜디오',subtitle:'검색 질의 · HyDE · 출처 · 신뢰도 · 기술 보고서',s1:'목표와 모델',s2:'검색 조건과 자료',s3:'검색 질의와 HyDE',domainL:'도메인',modelL:'모델 프로필',modeL:'검색 방식',roleL:'역할',goalL:'핵심 목표',contextL:'배경 정보',constraintsL:'제약 조건',entitiesL:'핵심 엔티티 / 키워드',fromL:'기간 시작',toL:'기간 종료',topkL:'Top K',sourcesL:'자료원',queriesL:'검색 질의',hydeL:'가상 문서 (HyDE)',genQueries:'질의 자동 생성',genHyde:'HyDE 생성',build:'최종 프롬프트 생성',sample:'자동차 예시',clear:'초기화',finalTitle:'최종 시스템 프롬프트',copy:'복사',note:'모델은 교체 가능하며 검색·인용 계약은 유지됩니다.'},ja:{title:'GPT‑5.6 RAGプロンプトスタジオ',subtitle:'検索クエリ・HyDE・出典・信頼度・技術レポート',s1:'目標とモデル',s2:'検索条件と資料',s3:'検索クエリとHyDE',domainL:'ドメイン',modelL:'モデルプロファイル',modeL:'検索方式',roleL:'役割',goalL:'中核目標',contextL:'背景情報',constraintsL:'制約条件',entitiesL:'主要エンティティ / キーワード',fromL:'開始日',toL:'終了日',topkL:'Top K',sourcesL:'データソース',queriesL:'検索クエリ',hydeL:'仮想文書 (HyDE)',genQueries:'クエリ自動生成',genHyde:'HyDE生成',build:'最終プロンプト生成',sample:'自動車例',clear:'クリア',finalTitle:'最終システムプロンプト',copy:'コピー',note:'モデルを変更しても検索・引用契約は維持されます。'},en:{title:'GPT‑5.6 RAG Prompt Studio',subtitle:'Queries · HyDE · citations · confidence · technical reports',s1:'Goal and model',s2:'Retrieval scope and sources',s3:'Queries and HyDE',domainL:'Domain',modelL:'Model profile',modeL:'Retrieval mode',roleL:'Role',goalL:'Core goal',contextL:'Context',constraintsL:'Constraints',entitiesL:'Core entities / keywords',fromL:'Date from',toL:'Date to',topkL:'Top K',sourcesL:'Sources',queriesL:'Search queries',hydeL:'Hypothetical document (HyDE)',genQueries:'Generate queries',genHyde:'Generate HyDE',build:'Build final prompt',sample:'Automotive sample',clear:'Clear',finalTitle:'Final system prompt',copy:'Copy',note:'The model can change while the retrieval and citation contract stays stable.'}};
const fields=['domain','model','mode','role','goal','context','constraints','entities','from','to','topk','queries','hyde'];function v(id){return $(id).value.trim()}function srcs(){return[...document.querySelectorAll('.src input:checked')].map(x=>x.value)}function entities(){return v('entities').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
const synonyms={automotive:{pawl:['parking pawl','パーキングポール','파킹 폴'],spring:['detent spring','SPR-DET','ディテントスプリング'],grade:['slope','incline','勾配','경사'],lock:['P lock','parking lock','Pロック','P락']},quality:{defect:['nonconformity','NG','不具合','불량'],inspection:['visual inspection','검사','検査'],change:['4M change','process change','変更','변경']},general:{}};
function genQueries(){const es=entities(),goal=v('goal')||'target topic',d=v('domain'),dict=synonyms[d]||{};const ex=es.flatMap(e=>{const key=Object.keys(dict).find(k=>e.toLowerCase().includes(k));return key?[e,...dict[key]]:[e]}).slice(0,12);const date=v('from')||v('to')?` date:${v('from')||'*'}..${v('to')||'*'}`:'';const qs=[`"${goal}" ${ex.join(' OR ')}${date}`,`${ex.slice(0,5).join(' ')} failure mode root cause countermeasure`,`${ex.slice(0,5).join(' ')} test result requirement specification`,`${ex.slice(0,5).join(' ')} change history risk FMEA`,`${goal} evidence contradiction unresolved issue`];$('queries').value=qs.join('\n');build()}
function genHyde(){const e=entities().join(', ')||'(entities)';$('hyde').value=`A high-quality internal technical document would describe the objective “${v('goal')||'(goal)'}”, define ${e}, cite requirements and test conditions, compare current and proposed specifications, list failure modes and controls, quantify margins where evidence exists, and clearly identify unresolved assumptions. It would include source IDs, dates, version status, and a conclusion reviewed by the responsible engineer.`;build()}
function build(){const model=v('model'),sources=srcs(),qs=v('queries')||'(generate search queries first)',profile=model.includes('Sol')?'deep multi-pass reasoning and cross-document contradiction analysis':model.includes('Luna')?'fast retrieval and concise synthesis':'balanced retrieval, analysis, and verification';const p=`# SYSTEM — Evidence-grounded Engineering RAG Agent\n\n## Model profile\nTarget: ${model}\nBehavior: ${profile}. The retrieval contract below must remain valid if the model is changed.\n\n## Role\n${v('role')||'Domain expert and evidence reviewer'}\n\n## Final goal\n${v('goal')||'(No goal provided)'}\n\n## Context\n${v('context')||'(No context provided)'}\n\n## Constraints\n${v('constraints')||'Use concise Markdown. Do not expose confidential hidden reasoning.'}\n\n## Retrieval configuration\n- Domain: ${v('domain')}\n- Mode: ${v('mode')} (hybrid means keyword + semantic + metadata filtering)\n- Date range: ${v('from')||'open'} → ${v('to')||'open'}\n- Top K candidates: ${v('topk')}\n- Sources: ${sources.join(', ')||'(none selected)'}\n- Core entities: ${entities().join(', ')||'(none)'}\n\n## Search queries\n${qs.split('\n').map((q,i)=>`${i+1}. ${q}`).join('\n')}\n\n## HyDE seed (retrieval aid only; never treat as evidence)\n${v('hyde')||'(not generated)'}\n\n## Retrieval and evidence protocol\n1. Search each selected source using the queries, entity aliases, dates, versions, and project metadata.\n2. Deduplicate near-identical documents while retaining revision history.\n3. Rank evidence by authority, directness, recency, and applicability.\n4. For every material claim, attach [Source ID · document · page/slide/sheet-cell/image-region · revision/date].\n5. Separate direct evidence, inference, and unknowns. Never cite the HyDE text as a source.\n6. When sources conflict, show both positions and explain which is stronger and why.\n7. If evidence is insufficient, state “INSUFFICIENT EVIDENCE” and define the exact search/test needed.\n8. Do not reveal hidden chain-of-thought. Provide concise rationale, calculations, assumptions, and verification checks.\n\n## Required analysis\n- Current specification and requested change\n- Requirements / acceptance criteria\n- Evidence table and traceability\n- Failure modes, severity, occurrence, detection, and controls where applicable\n- Quantitative margins and sensitivity analysis only where data supports them\n- Counter-evidence and alternative explanations\n- Open issues, owners, due dates, and human approval gates\n\n## Final output format\n1. Executive conclusion (PASS / CONDITIONAL / FAIL / REVIEW) with confidence\n2. Key findings table\n3. Evidence matrix with exact citations\n4. Risks and contradictions\n5. Recommended actions by priority and owner\n6. Verification / test plan\n7. Appendix: query log, excluded sources, assumptions, and unresolved questions`;$('out').textContent=p;$('chars').textContent=p.length+' chars';$('lines').textContent=p.split('\n').length+' lines';$('profileBadge').textContent=model.toUpperCase();return p}
function apply(){const t=T[lang]||T.en;document.documentElement.lang=lang;$('lang').value=lang;document.querySelectorAll('[data-i]').forEach(e=>{if(t[e.dataset.i])e.textContent=t[e.dataset.i]});localStorage.setItem('rag-lang',lang);build()}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2000)}function dl(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
fields.forEach(id=>$(id).addEventListener('input',build));document.querySelectorAll('.src input').forEach(x=>x.addEventListener('change',build));$('genQueries').addEventListener('click',genQueries);$('genHyde').addEventListener('click',genHyde);$('build').addEventListener('click',()=>{build();toast('Prompt rebuilt')});$('sample').addEventListener('click',()=>{$('domain').value='automotive';$('role').value='자동차 변속기 조작계 설계 및 품질 검토 전문가';$('goal').value='Parking pawl 폭 변경과 DET spring 하중 규격 변경의 성능·강도·품질 리스크 검토';$('context').value='33% 경사 P-lock 불성립 대책. 현행/대책 사양, 시험결과, FMEA와 도면 변경 이력을 통합해야 함.';$('constraints').value='회사 내부 문서만 사용. 문서 개정과 부품번호를 구분. 근거 없는 수치 추정 금지.';$('entities').value='parking pawl, pawl width, detent spring, rod plate, 33% grade, P lock, FMEA';genQueries();genHyde();toast('예시를 입력했습니다')});$('clear').addEventListener('click',()=>{['goal','context','constraints','entities','from','to','queries','hyde'].forEach(id=>$(id).value='');build()});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(build());toast((T[lang]||T.en).copy+' ✓')}catch{toast('Clipboard unavailable')}});$('json').addEventListener('click',()=>dl('rag-prompt-config.json','application/json',JSON.stringify({model:v('model'),domain:v('domain'),mode:v('mode'),role:v('role'),goal:v('goal'),context:v('context'),constraints:v('constraints'),entities:entities(),date:{from:v('from'),to:v('to')},top_k:+v('topk'),sources:srcs(),queries:v('queries').split('\n').filter(Boolean),hyde:v('hyde'),system_prompt:build()},null,2)));$('txt').addEventListener('click',()=>dl('engineering-rag-prompt.txt','text/plain;charset=utf-8',build()));$('lang').addEventListener('change',e=>{lang=e.target.value;apply()});$('theme').addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('rag-theme',n)});document.documentElement.dataset.theme=localStorage.getItem('rag-theme')||'dark';apply();
</script>
