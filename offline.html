<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#176f60">
  <title>Offline · myprompt</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8f5;color:#20352e;font:16px/1.7 system-ui,sans-serif}main{width:min(100% - 40px,560px);padding:36px;border:1px solid #dce2da;border-radius:24px;background:white}.brand{color:#176f60;font-weight:750;letter-spacing:-.04em;font-size:24px}h1{font-size:28px;line-height:1.3}p{color:#64716b}a{display:inline-block;padding:10px 18px;background:#176f60;color:white;border-radius:10px;text-decoration:none}select{max-width:100%;padding:8px;border:1px solid #dce2da;border-radius:8px;background:white;color:#20352e;margin-top:24px}a:focus-visible,select:focus-visible{outline:3px solid #a4bd4d;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="brand">myprompt<span aria-hidden="true">.</span></div>
    <h1 id="heading">オフラインです</h1>
    <p id="message">保存済みのワークスペースは引き続き利用できます。初めて開くページは、接続後にもう一度お試しください。</p>
    <a id="home" href="./index.html#library">ライブラリへ戻る</a><br>
    <select id="language" aria-label="Language / 言語">
      <option value="ja">日本語</option><option value="zh">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="fr">Français</option><option value="es">Español</option><option value="ko">한국어</option>
    </select>
  </main>
  <script>
    const messages = {
      ja: ['オフラインです', '保存済みのワークスペースは引き続き利用できます。初めて開くページは、接続後にもう一度お試しください。', 'ライブラリへ戻る'],
      zh: ['当前处于离线状态', '已缓存的工作区仍可使用。首次访问的页面请在恢复网络连接后重试。', '返回提示词库'],
      en: ['You are offline', 'Your cached workspace is still available. For pages you have not opened before, reconnect and try again.', 'Back to the library'],
      vi: ['Bạn đang ngoại tuyến', 'Bạn vẫn có thể dùng không gian làm việc đã lưu trong bộ nhớ đệm. Hãy kết nối lại để mở trang chưa truy cập.', 'Trở lại thư viện'],
      fr: ['Vous êtes hors ligne', 'Votre espace de travail en cache reste disponible. Reconnectez-vous pour ouvrir une page encore jamais consultée.', 'Retour à la bibliothèque'],
      es: ['No tienes conexión', 'Tu espacio de trabajo guardado en caché sigue disponible. Reconéctate para abrir páginas que no hayas visitado.', 'Volver a la biblioteca'],
      ko: ['오프라인 상태입니다', '캐시된 작업 공간은 계속 사용할 수 있습니다. 처음 여는 페이지는 인터넷 연결 후 다시 시도해 주세요.', '라이브러리로 돌아가기']
    };
    const selector = document.getElementById('language');
    function render(language) {
      const selected = Object.hasOwn(messages, language) ? language : 'ja';
      document.documentElement.lang = selected;
      selector.value = selected;
      document.getElementById('heading').textContent = messages[selected][0];
      document.getElementById('message').textContent = messages[selected][1];
      document.getElementById('home').textContent = messages[selected][2];
    }
    let language = 'ja';
    try { language = JSON.parse(localStorage.getItem('myprompt.v2') || '{}').language || 'ja'; } catch (_) {}
    render(language);
    selector.addEventListener('change', () => render(selector.value));
  </script>
</body>
</html>
